<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sıcak Kitle Raporu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }
        h1 {
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-weight: bold;
            text-align: left;
            margin: 10px 0 5px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        button {
            background-color: green;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sıcak Kitle Raporu</h1>
        <label>Toplantı Başlığı:</label>
        <input type="text" id="title" placeholder="Başlık giriniz">

        <label>Tarih:</label>
        <input type="date" id="date">

        <label>Özet:</label>
        <textarea id="summary" rows="3" placeholder="Toplantı özetini yazınız..."></textarea>

        <label>Önemli Kararlar & Aksiyonlar:</label>
        <textarea id="decisions" rows="3" placeholder="Alınan kararları yazınız..."></textarea>

        <button onclick="sendToWhatsApp()">WhatsApp Grubuna Gönder</button>
    </div>

    <script>
        function sendToWhatsApp() {
            let title = document.getElementById("title").value;
            let date = document.getElementById("date").value;
            let summary = document.getElementById("summary").value;
            let decisions = document.getElementById("decisions").value;

            let message = `📌 *Toplantı Raporu*\n\n📅 Tarih: ${date}\n📝 Başlık: ${title}\n📋 Özet: ${summary}\n✅ Kararlar & Aksiyonlar: ${decisions}`;

            let whatsappURL = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
            window.open(whatsappURL, "_blank");
        }
    </script>
</body>
</html>
